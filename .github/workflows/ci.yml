name: CI

# The push/PR gate, and nothing else.
#
# One runner, no containers, no ffmpeg: a red build here always means the code is wrong. The
# integration and API E2E suites run locally. deploy.yml ships each green build.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}

      # The meme renderer draws with a system font; the tests that render need one to exist.
      - name: Install a font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Restore
        run: dotnet restore PoRedoMedia.slnx

      # TreatWarningsAsErrors is on, so this is the lint step too.
      - name: Build (0 warnings, 0 errors)
        run: dotnet build PoRedoMedia.slnx --no-restore --configuration Release

      - name: Check test budgets
        shell: pwsh
        run: ./scripts/check-test-budgets.ps1

      - name: Unit tests
        run: dotnet test tests/PoRedoMedia.UnitTests --no-build --configuration Release --verbosity normal
