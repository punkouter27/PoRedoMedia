name: Build & Deploy

# PoRedoMedia's only workflow. Job `deploy`: check formatting, build (Release, warnings are errors), run the Unit and
# Integration tiers (Integration starts its own Azurite through Testcontainers; Docker is on ubuntu-latest), publish,
# deploy to App Service, confirm the new build is the one answering. A red check stops the deploy and the live site
# keeps its last good build. Job `mobile`: builds the MAUI Android client so it always compiles; it never blocks the
# deploy. E2E tiers and Bicep run locally, not here.
#
# Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (GitHub OIDC sign-in),
#                 AZURE_WEBAPP_NAME, AZURE_RESOURCE_GROUP (what is deployed, where).
# Hook: scripts/ci-package.ps1 -PublishDir adds a static ffmpeg and fonts to the package (gets $env:APP, $env:RG and
#       $env:BASE_URL).

on:
  push:
    branches: [master]
    paths-ignore: ['*.md', 'SCREENSHOTS/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    env:   # the hooks read these
      APP: ${{ vars.AZURE_WEBAPP_NAME }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      BASE_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the build stamp and MinVer read git history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check formatting
        run: dotnet format *.slnx --verify-no-changes

      - name: Build
        run: dotnet build *.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/*.Unit/*.csproj -c Release --no-build

      - name: Install ffmpeg (the Integration tier renders and probes real video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Integration tests
        run: dotnet test tests/*.Integration/*.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/*.Api/*.csproj -c Release --no-build -o publish

      - name: Package extras (scripts/ci-package.ps1)
        if: hashFiles('scripts/ci-package.ps1') != ''
        shell: pwsh
        run: ./scripts/ci-package.ps1 -PublishDir publish

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          package: publish

      - name: Confirm this commit is live (/health/live X-Commit)
        run: |
          for attempt in $(seq 1 40); do
            commit=$(curl -s -D - -o /dev/null --max-time 20 "$BASE_URL/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}' || true)
            [ "$commit" = "$GITHUB_SHA" ] && { echo "Live on $GITHUB_SHA (attempt $attempt)"; exit 0; }
            sleep 10
          done
          echo "::error::/health/live serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1

  mobile:
    name: Build the Android client (MAUI)
    needs: []          # runs beside deploy and never blocks it
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the build stamp reads git history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-mobile-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-mobile-${{ runner.os }}-

      - name: Install the maui-android workload
        run: dotnet workload install maui-android

      - name: Build the Android target
        run: dotnet build src/PoRedoMedia.Mobile/PoRedoMedia.Mobile.csproj -c Release -f net10.0-android
